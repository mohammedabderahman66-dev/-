<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>Warsha ورشة</title>
<link rel="stylesheet" href="brand.css">
<style>
  .splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:env(safe-area-inset-top) 1.5rem env(safe-area-inset-bottom);text-align:center}
  .splash svg{width:112px;height:112px}
  .splash h1{font-size:3.2rem;color:var(--copper);line-height:1.1}
  .latin{font:500 .95rem var(--font-body);letter-spacing:.35em;color:var(--teal);direction:ltr}
  .splash p{margin:.25rem 0 0;font-size:1.15rem;max-width:20rem}
  .chip{display:inline-block;margin-top:1rem;padding:.35rem .9rem;border-radius:999px;background:var(--surface);color:var(--teal);font-size:.9rem}
</style>
</head>
<body>
<main class="splash">
  <svg viewBox="0 0 512 512" role="img" aria-label="Warsha">
    <g fill="none" stroke="var(--copper)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round">
      <rect x="222" y="84" width="178" height="176" rx="58"/>
      <path d="M368 262 C368 376 336 428 248 428 C186 428 142 398 112 346"/>
    </g>
  </svg>
  <h1>ورشة</h1>
  <div class="latin">WARSHA</div>
  <p>فكرتك تصبح تطبيقاً على هاتفك</p>
  <span class="chip">نسخة تجريبية</span>
</main>
</body>
</html>
