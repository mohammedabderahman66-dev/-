<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="1020" cy="80" r="220" fill="url(#glow)"/>
  <circle cx="140" cy="260" r="160" fill="url(#glow)"/>

  <!-- شبكة نقاط زخرفية -->
  <g fill="#38bdf8" opacity="0.18">
    <circle cx="60" cy="40" r="2.5"/><circle cx="100" cy="40" r="2.5"/><circle cx="140" cy="40" r="2.5"/>
    <circle cx="60" cy="80" r="2.5"/><circle cx="100" cy="80" r="2.5"/><circle cx="140" cy="80" r="2.5"/>
    <circle cx="1060" cy="260" r="2.5"/><circle cx="1100" cy="260" r="2.5"/><circle cx="1140" cy="260" r="2.5"/>
    <circle cx="1060" cy="280" r="2.5"/><circle cx="1100" cy="280" r="2.5"/><circle cx="1140" cy="280" r="2.5"/>
  </g>

  <!-- أيقونة بناء (مكعبات متراصة توحي ببناء تطبيق) -->
  <g transform="translate(90,100)">
    <rect x="0" y="60" width="50" height="50" rx="10" fill="url(#accent)" opacity="0.95"/>
    <rect x="58" y="30" width="50" height="80" rx="10" fill="url(#accent)" opacity="0.75"/>
    <rect x="116" y="0" width="50" height="110" rx="10" fill="url(#accent)" opacity="0.55"/>
  </g>

  <!-- النص -->
  <text x="320" y="150" font-family="Tahoma, Arial, sans-serif" font-size="68" font-weight="700" fill="#f8fafc">ورشة</text>
  <text x="320" y="150" font-family="Tahoma, Arial, sans-serif" font-size="68" font-weight="700" fill="#f8fafc" opacity="0"></text>
  <text x="320" y="200" font-family="Arial, sans-serif" font-size="26" letter-spacing="6" fill="url(#accent)" font-weight="600">W A R S H A</text>
  <text x="322" y="240" font-family="Tahoma, Arial, sans-serif" font-size="22" fill="#94a3b8">من فكرة إلى تطبيق مثبّت — بدون خبرة برمجية</text>

  <!-- خط فاصل زخرفي -->
  <rect x="320" y="256" width="560" height="4" rx="2" fill="url(#accent)" opacity="0.8"/>
</svg>
